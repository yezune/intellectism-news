name: Daily news

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Setup project
        run: make setup

      - name: Check
        run: make check

      - name: Collect daily news
        run: |
          make daily FIELD=labor
          make daily FIELD=ownership
          make daily FIELD=policy

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests state
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore: daily news $(date -u +%F)"
            git push origin HEAD:main
          fi
