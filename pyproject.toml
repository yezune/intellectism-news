[project]
name = "intellectism-news"
version = "0.1.0"
description = "Field-specific news collectors for the intellectism channel"
requires-python = ">=3.14"
dependencies = [
  "requests>=2.32",
  "feedparser>=6.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
intellectism-news = "intellectism_news.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellectism_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
