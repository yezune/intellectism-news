[package]
name = "inews-core"
version = "0.1.0"
edition = "2024"
description = "Schema and URL normalization for intellectism-news"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
